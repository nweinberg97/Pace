name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        # Scripts and styles get a per-commit path so a new deploy is never
        # mixed with stale copies held by the CDN or a visitor's browser.
        run: |
          V="${GITHUB_SHA::8}"
          mkdir _site
          # Plain paths stay too, for any cached copy of an older index.html.
          cp -r favicon.ico .nojekyll assets js styles.css _site/
          cp -r js "_site/js-$V"
          cp styles.css "_site/styles-$V.css"
          sed -e "s#href=\"styles.css\"#href=\"styles-$V.css\"#" \
              -e "s#src=\"js/app.js\"#src=\"js-$V/app.js\"#" \
              index.html > _site/index.html
          grep -q "js-$V/app.js" _site/index.html
          grep -q "styles-$V.css" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
